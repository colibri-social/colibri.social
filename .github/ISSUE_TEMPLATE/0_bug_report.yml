name: "🐛 Bug report"
description: Create a report to help us improve Colibri
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report! 🙌
  - type: textarea
    id: description
    attributes:
      label: "📝 Describe the bug"
      description: A clear and concise description of what the bug is.
      placeholder: When I click the submit button, the page freezes.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "👣 Steps to Reproduce"
      description: How can we see the error ourselves?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: "💻 Operating System"
      description: What kind of OS were you using?
      options:
        - iOS/iPadOS
        - MacOS
        - Android (Phone / Tablet)
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: installation-method
    attributes:
      label: "📦 Installation Method"
      description: How are you accessing Colibri?
      options:
        - App Store
        - Play Store
        - Microsoft Store
        - Homebrew
        - DMG
        - Windows Installer
        - Scoop
        - AppImage
        - .rpm
        - .deb
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: "🖥️ OS Version"
      description: Which operating system and version are you running?
      placeholder: e.g. macOS 15.1, Windows 11 23H2, iOS 18.1, Android 15
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "💡 Additional context"
      description: Add any other context or drag-and-drop screenshots here.
  - type: checkboxes
    id: participation
    attributes:
      label: "🤝 Participation"
      options:
        - label: I am willing to submit a pull request for this issue.
