name: Checks

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  manage-changesets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for Changesets or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: echo "Version PR merged. Initializing app compilation..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Triggers the multi-platform Tauri builder ONLY when the Version PR is merged
      - name: Trigger Tauri Build Workflow
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml --ref main
