name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0-rc.3)."
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "ubuntu-24.04-arm"
            args: ""
          - platform: "windows-latest"
            args: "--bundles nsis"
          # Android configuration targeting ubuntu-latest
          - platform: "ubuntu-latest"
            mobile: "android"
            is-android: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: install dependencies (ubuntu desktop only)
        if: (matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm') && !matrix.is-android
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install frontend dependencies (for CLI access)
        run: pnpm install --frozen-lockfile

      # Android Prerequisites: JDK & Android NDK/SDK configuration
      - name: set up JDK 17 (Android only)
        if: matrix.is-android
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: setup Android SDK (Android only)
        if: matrix.is-android
        uses: android-actions/setup-android@v3

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
            ${{ matrix.is-android && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "packages/wrapper/src-tauri -> target"

      # TODO(appstore): Only needed for Mac App Store submissions.
      # Uncomment when producing a MAS build:
      # - name: install Apple provisioning profile (macOS only)
      #   if: matrix.platform == 'macos-latest'
      #   env:
      #     MAC_PROVISIONPROFILE: ${{ secrets.MAC_PROVISIONPROFILE }}
      #   run: |
      #     echo "$MAC_PROVISIONPROFILE" | base64 --decode > packages/wrapper/src-tauri/Colibri_Mac.provisionprofile

      - name: install App Store Connect API key (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey.p8
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # Android Code Signing setup matching official docs
      - name: Setup Android signing (Android only)
        if: matrix.is-android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          mkdir -p packages/wrapper/src-tauri/gen/android
          cd packages/wrapper/src-tauri/gen/android
          echo "keyAlias=${{ env.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ env.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          mkdir -p $RUNNER_TEMP/keystore
          echo "$ANDROID_KEY_BASE64" | base64 --decode > $RUNNER_TEMP/keystore/release.jks
          echo "storeFile=$RUNNER_TEMP/keystore/release.jks" >> keystore.properties

      # openssl-sys builds vendored OpenSSL from source for the Android targets
      # (no prebuilt ships for them)
      - name: Alias NDK binutils for openssl-src (Android only)
        if: matrix.is-android
        shell: bash
        run: |
          set -eu
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-${NDK_HOME:-}}}"
          if [ -z "$NDK" ]; then
            echo "No Android NDK path found (ANDROID_NDK_ROOT/ANDROID_NDK_LATEST_HOME/NDK_HOME)" >&2
            exit 1
          fi
          BIN=$(echo "$NDK"/toolchains/llvm/prebuilt/*/bin)
          echo "Using NDK llvm bin dir: $BIN"
          test -x "$BIN/llvm-ranlib"
          for prefix in aarch64-linux-android arm-linux-androideabi armv7a-linux-androideabi i686-linux-android x86_64-linux-android; do
            ln -sf "$BIN/llvm-ranlib" "$BIN/${prefix}-ranlib"
            ln -sf "$BIN/llvm-ar" "$BIN/${prefix}-ar"
          done
          ls -l "$BIN"/*-ranlib
          # OpenSSL's Makefile calls ranlib by bare name, so the aliases must be
          # on PATH when tauri-action runs cargo build in the following step.
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Sync version
        run: node packages/wrapper/scripts/set-version.mjs "${{ inputs.version }}" "${{ github.run_number }}"

      - name: Compute Android version code (Android only)
        if: matrix.is-android
        run: echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.WRAPPER_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.NATIVE_SENTRY_DSN }}
          # macOS Environment Variables
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          ANDROID_KEY_ALIAS: ${{ matrix.platform == 'ubuntu-latest' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_BASE64: ${{ matrix.platform == 'ubuntu-latest' && secrets.ANDROID_KEY_BASE64 || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'ubuntu-latest' && env.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
        with:
          projectPath: "packages/wrapper"
          tagName: v${{ inputs.version }}
          releaseName: "Colibri Social ${{ inputs.version }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
          mobile: ${{ matrix.mobile }}

      - name: Verify macOS signing and notarization
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          DMG=$(ls packages/wrapper/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          hdiutil attach -nobrowse -readonly "$DMG" -mountpoint /tmp/colibri-verify
          trap 'hdiutil detach /tmp/colibri-verify || true' EXIT
          APP=$(ls -d /tmp/colibri-verify/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type exec --verbose=4 "$APP"

      - name: Upload Rust debug symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: colibri-social
          SENTRY_PROJECT: rust-native-app
        run: pnpm dlx @sentry/cli debug-files upload --include-sources packages/wrapper/src-tauri/target

      - name: Route AAB to Play, remove from release (Android only)
        if: matrix.is-android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REPO="${{ github.repository }}"
          AAB=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("\\.aab$"))][0] // ""')
          test -n "$AAB"
          gh release download "$TAG" --repo "$REPO" --pattern "$AAB" --dir aab-out
          gh release delete-asset "$TAG" "$AAB" --yes

      - name: Upload AAB artifact (Android only)
        if: matrix.is-android
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: aab-out/*.aab
          if-no-files-found: error

  homebrew:
    needs: publish-tauri
    runs-on: macos-latest
    steps:
      - name: Mint tap token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: colibri-social
          repositories: homebrew-tap

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REPO="${{ github.repository }}"
          ASSET=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("\\.dmg$"))][0] // ""')
          test -n "$ASSET"
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir dl
          SHA=$(shasum -a 256 "dl/$ASSET" | cut -d' ' -f1)
          ENC=$(jq -rn --arg s "$ASSET" '$s|@uri')
          URL="https://github.com/$REPO/releases/download/$TAG/$ENC"
          TAP_DIR="$(brew --repository)/Library/Taps/colibri-social/homebrew-tap"
          rm -rf "$TAP_DIR"
          mkdir -p "$(dirname "$TAP_DIR")"
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/colibri-social/homebrew-tap.git" "$TAP_DIR"
          echo "TAP_DIR=$TAP_DIR" >> "$GITHUB_ENV"
          mkdir -p "$TAP_DIR/Casks"
          cat > "$TAP_DIR/Casks/colibri-social.rb" <<RUBY
          cask "colibri-social" do
            version "$VERSION"
            sha256 "$SHA"

            url "$URL"
            name "Colibri Social"
            desc "Next-generation social chat app built on the AT Protocol"
            homepage "https://colibri.social"

            app "Colibri Social.app"

            zap trash: [
              "~/Library/Application Support/social.colibri.app",
              "~/Library/Caches/social.colibri.app",
              "~/Library/Preferences/social.colibri.app.plist",
              "~/Library/Saved Application State/social.colibri.app.savedState",
            ]
          end
          RUBY

      # Installs the generated cask exactly as a user would, then checks the
      # bundle seal, notarization ticket and Gatekeeper verdict. Anything the
      # cask does to the app bundle that invalidates its signature fails here,
      # before the tap ever serves it.
      - name: Verify cask install
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install --cask colibri-social/tap/colibri-social
          APP="/Applications/Colibri Social.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type exec --verbose=4 "$APP"

      - name: Push cask
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$TAP_DIR"
          git config user.name "colibri-release[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/colibri-social.rb
          git diff --cached --quiet && exit 0
          git commit -m "colibri-social $VERSION"
          git branch -M main
          git push origin HEAD:main

  scoop:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Mint bucket token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: colibri-social
          repositories: scoop-bucket

      - name: Update Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REPO="${{ github.repository }}"
          ASSET=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("setup\\.exe$"))][0] // ""')
          test -n "$ASSET"
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir dl
          SHA=$(sha256sum "dl/$ASSET" | cut -d' ' -f1)
          ENC=$(jq -rn --arg s "$ASSET" '$s|@uri')
          URL="https://github.com/$REPO/releases/download/$TAG/$ENC#/dl.7z"
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/colibri-social/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          jq -n --arg v "$VERSION" --arg url "$URL" --arg hash "$SHA" '{
            version: $v,
            description: "Next-generation social chat app built on the AT Protocol",
            homepage: "https://colibri.social",
            license: "MIT",
            architecture: { "64bit": { url: $url, hash: $hash } },
            post_install: ["Remove-Item \"$dir\\`$PLUGINSDIR\" -Recurse -Force -ErrorAction SilentlyContinue"],
            shortcuts: [["Colibri Social.exe", "Colibri Social"]]
          }' > bucket/bucket/colibri-social.json
          cd bucket
          git config user.name "colibri-release[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/colibri-social.json
          git diff --cached --quiet && exit 0
          git commit -m "colibri-social $VERSION"
          git branch -M main
          git push origin HEAD:main

  play:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: dl

      - name: Upload to Play (closed testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: social.colibri.app
          releaseFiles: dl/*.aab
          track: alpha
          status: completed

  msstore-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "packages/wrapper/src-tauri -> target"

      - name: install msixbundle-cli
        shell: bash
        run: cargo install msixbundle-cli --locked

      - name: verify msixbundle-cli runs
        shell: pwsh
        run: msixbundle-cli --version

      - name: Compute Store version and Windows build overrides
        shell: bash
        run: |
          set -euo pipefail
          APP_MAJOR=$(echo "${{ inputs.version }}" | cut -d. -f1)
          APP_MINOR=$(echo "${{ inputs.version }}" | cut -d. -f2)
          STORE_MINOR=$((10#$APP_MAJOR * 1000 + 10#$APP_MINOR))
          STORE_VERSION="1.${STORE_MINOR}.${GITHUB_RUN_NUMBER}"
          echo "MSIX Store version (padded to .0 by the bundler): ${STORE_VERSION}.0"
          cat > packages/wrapper/src-tauri/tauri.windows.conf.json <<JSON
          {
            "identifier": "LouisEscher.ColibriSocial",
            "version": "${STORE_VERSION}",
            "mainBinaryName": "ColibriSocial"
          }
          JSON

      - name: Build MSIX bundle (x64)
        working-directory: packages/wrapper
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.WRAPPER_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.NATIVE_SENTRY_DSN }}
        run: pnpm dlx --config.optional=false @choochmeque/tauri-windows-bundle@0.1.28 build --arch x64 --runner pnpm --verbose

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: packages/wrapper/src-tauri/target/msix/*.msixbundle
          if-no-files-found: error

  msstore-deploy:
    needs: msstore-build
    runs-on: windows-latest
    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: msix-store
          path: dl

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure store credentials
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          $tenantId = "$env:STORE_TENANT_ID".Trim()
          $sellerId = "$env:STORE_SELLER_ID".Trim()
          $clientId = "$env:STORE_CLIENT_ID".Trim()
          $clientSecret = "$env:STORE_CLIENT_SECRET".Trim()
          foreach ($pair in @(
            @("AZURE_AD_TENANT_ID", $tenantId),
            @("SELLER_ID", $sellerId),
            @("AZURE_AD_APPLICATION_CLIENT_ID", $clientId),
            @("AZURE_AD_APPLICATION_SECRET", $clientSecret)
          )) {
            if ([string]::IsNullOrWhiteSpace($pair[1])) { throw "Repository secret $($pair[0]) is empty or unset." }
          }
          if ($sellerId -notmatch '^\d+$') {
            throw "Repository secret SELLER_ID must be the numeric Seller Id from Partner Center (Account settings > Organization profile > Legal info). The stored value is $($sellerId.Length) characters and is not all digits."
          }
          if ($tenantId -notmatch '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$') {
            throw "Repository secret AZURE_AD_TENANT_ID must be a GUID."
          }
          if ($clientId -notmatch '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$') {
            throw "Repository secret AZURE_AD_APPLICATION_CLIENT_ID must be a GUID."
          }
          msstore reconfigure --tenantId $tenantId --sellerId $sellerId --clientId $clientId --clientSecret $clientSecret
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure exited with code $LASTEXITCODE" }

      - name: Publish MSIX to Microsoft Store
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path dl -Filter *.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw "No .msixbundle found in dl/" }
          Write-Host "Publishing $($bundle.Name) to product 9P8Q77FCCSWR"
          msstore publish $bundle.FullName -id 9P8Q77FCCSWR --verbose
