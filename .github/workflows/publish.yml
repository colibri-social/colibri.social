name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0-rc.3)."
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "ubuntu-24.04-arm"
            args: ""
          - platform: "windows-latest"
            args: "--bundles nsis"
          # Android configuration targeting ubuntu-latest
          - platform: "ubuntu-latest"
            mobile: "android"
            is-android: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: install dependencies (ubuntu desktop only)
        if: (matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm') && !matrix.is-android
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install frontend dependencies (for CLI access)
        run: pnpm install --frozen-lockfile

      # Android Prerequisites: JDK & Android NDK/SDK configuration
      - name: set up JDK 17 (Android only)
        if: matrix.is-android
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: setup Android SDK (Android only)
        if: matrix.is-android
        uses: android-actions/setup-android@v3

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
            ${{ matrix.is-android && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "packages/wrapper/src-tauri -> target"

      # TODO(appstore): Only needed for Mac App Store submissions.
      # Uncomment when producing a MAS build:
      # - name: install Apple provisioning profile (macOS only)
      #   if: matrix.platform == 'macos-latest'
      #   env:
      #     MAC_PROVISIONPROFILE: ${{ secrets.MAC_PROVISIONPROFILE }}
      #   run: |
      #     echo "$MAC_PROVISIONPROFILE" | base64 --decode > packages/wrapper/src-tauri/Colibri_Mac.provisionprofile

      - name: install App Store Connect API key (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey.p8
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # Android Code Signing setup matching official docs
      - name: Setup Android signing (Android only)
        if: matrix.is-android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          mkdir -p packages/wrapper/src-tauri/gen/android
          cd packages/wrapper/src-tauri/gen/android
          echo "keyAlias=${{ env.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ env.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          mkdir -p $RUNNER_TEMP/keystore
          echo "$ANDROID_KEY_BASE64" | base64 --decode > $RUNNER_TEMP/keystore/release.jks
          echo "storeFile=$RUNNER_TEMP/keystore/release.jks" >> keystore.properties

      # openssl-sys builds vendored OpenSSL from source for the Android targets
      # (no prebuilt ships for them)
      - name: Alias NDK binutils for openssl-src (Android only)
        if: matrix.is-android
        shell: bash
        run: |
          set -eu
          NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-${NDK_HOME:-}}}"
          if [ -z "$NDK" ]; then
            echo "No Android NDK path found (ANDROID_NDK_ROOT/ANDROID_NDK_LATEST_HOME/NDK_HOME)" >&2
            exit 1
          fi
          BIN=$(echo "$NDK"/toolchains/llvm/prebuilt/*/bin)
          echo "Using NDK llvm bin dir: $BIN"
          test -x "$BIN/llvm-ranlib"
          for prefix in aarch64-linux-android arm-linux-androideabi armv7a-linux-androideabi i686-linux-android x86_64-linux-android; do
            ln -sf "$BIN/llvm-ranlib" "$BIN/${prefix}-ranlib"
            ln -sf "$BIN/llvm-ar" "$BIN/${prefix}-ar"
          done
          ls -l "$BIN"/*-ranlib
          # OpenSSL's Makefile calls ranlib by bare name, so the aliases must be
          # on PATH when tauri-action runs cargo build in the following step.
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Sync version
        run: node packages/wrapper/scripts/set-version.mjs "${{ inputs.version }}" "${{ github.run_number }}"

      - name: Compute Android version code (Android only)
        if: matrix.is-android
        run: echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.WRAPPER_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.NATIVE_SENTRY_DSN }}
          # macOS Environment Variables
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          ANDROID_KEY_ALIAS: ${{ matrix.platform == 'ubuntu-latest' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_BASE64: ${{ matrix.platform == 'ubuntu-latest' && secrets.ANDROID_KEY_BASE64 || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'ubuntu-latest' && env.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
        with:
          projectPath: "packages/wrapper"
          tagName: v${{ inputs.version }}
          releaseName: "Colibri Social ${{ inputs.version }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
          mobile: ${{ matrix.mobile }}

      - name: Upload Rust debug symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: colibri-social
          SENTRY_PROJECT: rust-native-app
        run: pnpm dlx @sentry/cli debug-files upload --include-sources packages/wrapper/src-tauri/target

      - name: Route AAB to Play, remove from release (Android only)
        if: matrix.is-android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REPO="${{ github.repository }}"
          AAB=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("\\.aab$"))][0] // ""')
          test -n "$AAB"
          gh release download "$TAG" --repo "$REPO" --pattern "$AAB" --dir aab-out
          gh release delete-asset "$TAG" "$AAB" --yes

      - name: Upload AAB artifact (Android only)
        if: matrix.is-android
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: aab-out/*.aab
          if-no-files-found: error

  homebrew:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Mint tap token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: colibri-social
          repositories: homebrew-tap

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REPO="${{ github.repository }}"
          ASSET=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("\\.dmg$"))][0] // ""')
          test -n "$ASSET"
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir dl
          SHA=$(sha256sum "dl/$ASSET" | cut -d' ' -f1)
          ENC=$(jq -rn --arg s "$ASSET" '$s|@uri')
          URL="https://github.com/$REPO/releases/download/$TAG/$ENC"
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/colibri-social/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/colibri-social.rb <<RUBY
          cask "colibri-social" do
            version "$VERSION"
            sha256 "$SHA"

            url "$URL"
            name "Colibri Social"
            desc "Next-generation social chat app built on the AT Protocol"
            homepage "https://colibri.social"

            app "Colibri Social.app"

            postflight do
              File.write("#{appdir}/Colibri Social.app/Contents/Resources/.install-channel", "homebrew")
            end

            zap trash: [
              "~/Library/Application Support/social.colibri.app",
              "~/Library/Caches/social.colibri.app",
              "~/Library/Preferences/social.colibri.app.plist",
              "~/Library/Saved Application State/social.colibri.app.savedState",
            ]
          end
          RUBY
          cd tap
          git config user.name "colibri-release[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/colibri-social.rb
          git diff --cached --quiet && exit 0
          git commit -m "colibri-social $VERSION"
          git branch -M main
          git push origin HEAD:main

  scoop:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Mint bucket token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: colibri-social
          repositories: scoop-bucket

      - name: Update Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REPO="${{ github.repository }}"
          ASSET=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("setup\\.exe$"))][0] // ""')
          test -n "$ASSET"
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir dl
          SHA=$(sha256sum "dl/$ASSET" | cut -d' ' -f1)
          ENC=$(jq -rn --arg s "$ASSET" '$s|@uri')
          URL="https://github.com/$REPO/releases/download/$TAG/$ENC#/dl.7z"
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/colibri-social/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          jq -n --arg v "$VERSION" --arg url "$URL" --arg hash "$SHA" '{
            version: $v,
            description: "Next-generation social chat app built on the AT Protocol",
            homepage: "https://colibri.social",
            license: "MIT",
            architecture: { "64bit": { url: $url, hash: $hash } },
            post_install: ["Remove-Item \"$dir\\`$PLUGINSDIR\" -Recurse -Force -ErrorAction SilentlyContinue"],
            shortcuts: [["Colibri Social.exe", "Colibri Social"]]
          }' > bucket/bucket/colibri-social.json
          cd bucket
          git config user.name "colibri-release[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/colibri-social.json
          git diff --cached --quiet && exit 0
          git commit -m "colibri-social $VERSION"
          git branch -M main
          git push origin HEAD:main

  play:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: dl

      - name: Upload to Play (closed testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: social.colibri.app
          releaseFiles: dl/*.aab
          track: alpha
          status: completed
