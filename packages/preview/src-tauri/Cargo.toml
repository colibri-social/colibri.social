[package]
name = "colibri-preview"
version = "0.0.0"
description = "Native preview shell for the new Colibri client with mock data."
authors = ["Louis Escher"]
license = "MIT"
edition = "2021"

[lib]
name = "preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }
