[package]
name = "colibri-social"
version = "0.1.14"
description = "Colibri is a next-generation social chat app built on the AT protocol."
authors = ["Louis Escher", "Reuben Tier"]
homepage = "https://colibri.social"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wrapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[features]
# Sentry is on by default. Disable it (`--no-default-features`, wired to the
# DISABLE_SENTRY env var via scripts/tauri.mjs) to exclude the sentry crate from
# the build entirely for no-track distributions like F-Droid.
default = ["sentry", "updater"]
sentry = ["dep:sentry"]
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-plugin-fs"]

[dependencies]
tauri = { version = "2", features = ["config-json5"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentry = { version = "0.48.4", optional = true }
tauri-plugin-notification = "2.3.3"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-os = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "net", "sync", "macros"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.tokio-tungstenite]
version = "0.28"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.futures-util]
version = "0.3"
default-features = false
features = ["sink"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.base64]
version = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.getrandom]
version = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSImageRep",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "UNNotification",
    "UNNotificationAttachment",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
    "bitflags",
    "block2",
    "std",
] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGWindow"] }
objc2-core-media = { version = "0.3", features = [
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMSync",
    "CMTime",
    "objc2-core-audio-types",
    "objc2-core-video",
] }
objc2-core-audio-types = "0.3"
objc2-core-video = { version = "0.3", features = [
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCError",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }
objc2-video-toolbox = { version = "0.3", features = [
    "VTBase",
    "VTCompressionProperties",
    "VTCompressionSession",
    "VTErrors",
    "VTSession",
    "block2",
    "objc2-core-media",
    "objc2-core-video",
] }
dispatch2 = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
tauri-winrt-notification = "0.7"
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# native-tls (pulled in transitively via reqwest, used by sentry/tauri plugins)
# needs a prebuilt OpenSSL per target. None ships for Android/iOS cross targets,
# so build OpenSSL from source for those instead of relying on pkg-config.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# Android only for now
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fcm = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-webview-insets = "0.1"
tauri-plugin-keyboard-inset = { path = "plugins" }
